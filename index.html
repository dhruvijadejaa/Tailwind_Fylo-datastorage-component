<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/icon-document.svg">
  <link rel="stylesheet" href="style.css">
  <title>Frontend Mentor | Fylo data storage component</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->

    .attribution { font-size: 0.6875rem; text-align: center; }

</head>
<body>
  <div class="w-full h-screen flex items-center justify-center">
    <main class="flex gap-3">
      <div class="w-[400px] h-[200px] bg-[var(--blue-850)] 
      rounded-2xl rounded-tr-[5rem] p-8 ">
        <div class="mt-1.5 mb-8">

        </div>
        <div class="flex mr-30 justify-start items-center gap-4 ">
          <div class="bg-[var(--blue-950)] w-12 h-12.5 flex items-center justify-center rounded-xl">
            <img src="./images/icon-document.svg" alt=""
            class="size-7"></div>
          <div class="bg-[var(--blue-950)] w-12 h-12.5 flex items-center justify-center rounded-xl">
            <img src="./images/icon-folder.svg" alt=""
            class="size-7"></div>
          <div class="bg-[var(--blue-950)] w-12 h-12.5 flex items-center justify-center rounded-xl">
            <img src="./images/icon-upload.svg" alt=""
            class="size-7"></div>
         
        </div>
      </div>

      <div class="w-[200px] h-[100px] bg-[var(--blue-850)]">
        <p>You’ve used 815 GB of your storage</p>  
        <div class="bg-[var(--blue-950)] rounded-full w-[200px]">ok</div>

    </main>
