<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/logo.svg">
  <link rel="stylesheet" href="style.css">
  <title>Frontend Mentor | Fylo data storage component</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 0.6875rem; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body>
  <div class=" relative w-full h-screen flex items-center justify-center 
  bg-[var(--blue-950)]">
    <img src="./images/bg-desktop.png" alt=""
    class="absolute bottom-0">
    
    <main class="flex gap-3 items-end xs:flex xs:flex-col">
      <div class="z-10 w-[400px] h-[200px] bg-[var(--blue-850)] 
      rounded-2xl rounded-tr-[7rem] p-8 ">
        <div class="mt-1.5 mb-8">
          <img src="./images/logo.svg" alt="">
        </div>
        <div class="flex mr-30 justify-start items-center gap-4 ">
          <div class="bg-[var(--blue-950)] w-12 h-12.5 flex items-center justify-center rounded-xl">
            <img src="./images/icon-document.svg" alt=""
            class="size-7"></div>
          <div class="bg-[var(--blue-950)] w-12 h-12.5 flex items-center justify-center rounded-xl">
            <img src="./images/icon-folder.svg" alt=""
            class="size-7"></div>
          <div class="bg-[var(--blue-950)] w-12 h-12.5 flex items-center justify-center rounded-xl">
            <img src="./images/icon-upload.svg" alt=""
            class="size-7"></div>
         
        </div>
      </div>

      <div class="relative w-[600px] h-[150px] bg-[var(--blue-850)] rounded-2xl p-7 text-white">
        <p class="mb-3">You’ve used 815 GB of your storage</p>  
        <div class="bg-[var(--blue-950)] flex items-center rounded-full w-[550px] h-[1rem]">
          <div class= "bg-gradient-to-r from-red-500 to-yellow-200 rounded-full 
          w-[350px] h-[0.8rem]" >
        <div class="bg-white h-3 w-3 rounded-[50%] ml-[340px]"></div>
        </div>
        </div>
        <div class="flex justify-between font-extralight">
          <p>0 GB</p>
          <p>1000 GB</p>
        </div>
        
        <div class="absolute -top-7 right-8">

          <div class="relative w-40 h-17 bg-white
          rounded-2xl rounded-br-none
          text-black font-extrabold text-center pt-5 text-xl">185 <span class="font-extralight text-gray-400">GB LEFT</span></div>
          
          <div class="absolute w-0 h-0 
          -bottom-5 right-0 border-t-25 border-l-25 border-l-transparent
          border-t-white"></div>

        </div>

      <div>
    </main>
  </div>

  <source src="./main.js" type="">
</body>
</html>
